services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: bankconv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
